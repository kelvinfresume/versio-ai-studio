services:
  postgres:
    image: postgres:16
    container_name: versio-dev-postgres
    environment:
      POSTGRES_USER: versio
      POSTGRES_PASSWORD: versio_dev_password
      POSTGRES_DB: versio_dev
    ports:
      - "5432:5432"
    volumes:
      - versio_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: versio-dev-redis
    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    container_name: versio-dev-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: versio
      MINIO_ROOT_PASSWORD: versio_dev_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - versio_minio_data:/data

  backend:
    build:
      context: ./backend/fastapi-api
    container_name: versio-dev-backend
    ports:
      - "8000:8000"
    environment:
      APP_ENV: dev
      DATABASE_URL: postgresql://versio:versio_dev_password@postgres:5432/versio_dev
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET_ASSETS: versio-dev-assets
      S3_BUCKET_EXPORTS: versio-dev-exports
    depends_on:
      - postgres
      - redis
      - minio

  jenkins:
    image: jenkins/jenkins:lts-jdk17
    container_name: versio-dev-jenkins
    user: root
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - versio_jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  versio_postgres_data:
  versio_minio_data:
  versio_jenkins_home: