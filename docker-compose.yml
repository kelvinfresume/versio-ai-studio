services:
  postgres:
    image: postgres:16
    container_name: versio-dev-postgres
    environment:
      POSTGRES_USER: versio
      POSTGRES_PASSWORD: versio_dev_password
      POSTGRES_DB: versio_dev
    ports:
      - "5432:5432"
    volumes:
      - versio_postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: versio-dev-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@versio.local
      PGADMIN_DEFAULT_PASSWORD: versio_dev_password
    ports:
      - "5050:80"
    depends_on:
      - postgres
    volumes:
      - versio_pgadmin_data:/var/lib/pgadmin

  redis:
    image: redis:7
    container_name: versio-dev-redis
    ports:
      - "6379:6379"

  redisinsight:
    image: redis/redisinsight:latest
    container_name: versio-dev-redisinsight
    ports:
      - "5540:5540"
    depends_on:
      - redis
    volumes:
      - versio_redisinsight_data:/data

  minio:
    image: minio/minio:latest
    container_name: versio-dev-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: versio
      MINIO_ROOT_PASSWORD: versio_dev_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - versio_minio_data:/data

  backend:
    build:
      context: ./backend/fastapi-api
    container_name: versio-dev-backend
    ports:
      - "8000:8000"
    environment:
      APP_ENV: dev
      DATABASE_URL: postgresql://versio:versio_dev_password@postgres:5432/versio_dev
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY_ID: versio
      S3_SECRET_ACCESS_KEY: versio_dev_password
      S3_BUCKET_ASSETS: versio-dev-assets
      S3_BUCKET_EXPORTS: versio-dev-exports
    depends_on:
      - postgres
      - redis
      - minio

  jenkins:
    image: jenkins/jenkins:lts-jdk17
    container_name: versio-dev-jenkins
    user: root
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - versio_jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

  frontend:
    build:
      context: ./frontend/nextjs-app
    container_name: versio-dev-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend

  vault:
    image: hashicorp/vault:latest
    container_name: versio-dev-vault
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: versio-dev-root-token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    volumes:
      - versio_vault_data:/vault/file

volumes:
  versio_postgres_data:
  versio_pgadmin_data:
  versio_redisinsight_data:
  versio_vault_data:
  versio_minio_data:
  versio_jenkins_home: