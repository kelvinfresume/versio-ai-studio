name: Versio Dev CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
  pull_request:
    branches:
      - main
      - develop

jobs:
  validate-compose:
    name: Validate Docker Compose
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate compose file
        run: docker compose config

  backend-check:
    name: Backend Syntax Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend/fastapi-api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile backend
        working-directory: backend/fastapi-api
        run: python -m compileall app

  frontend-check:
    name: Frontend Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "26"
          cache: "npm"
          cache-dependency-path: frontend/nextjs-app/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend/nextjs-app
        run: npm ci

      - name: Build frontend
        working-directory: frontend/nextjs-app
        run: npm run build
